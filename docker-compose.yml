# Postgres 16 + pgvector, per design doc §6.
# `app` connects as the least-privileged role; `radreport_audit` is INSERT-only
# on audit_log (§6.8) and is created by migration 0002.
services:
  db:
    image: pgvector/pgvector:pg16
    # Slow-query log and per-statement stats from the first start; see ops/postgres/observability.sql.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "log_min_duration_statement=100", "-c", "track_io_timing=on"]
    environment:
      POSTGRES_USER: radreport
      POSTGRES_PASSWORD: radreport
      POSTGRES_DB: radreport
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radreport"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: radreport
      MINIO_ROOT_PASSWORD: radreport123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
