# Postgres 16 + pgvector, per design doc §6.
# `app` connects as the least-privileged role; `radreport_audit` is INSERT-only
# on audit_log (§6.8) and is created by migration 0002.
services:
  db:
    image: pgvector/pgvector:pg16
    # Slow-query log and per-statement stats from the first start; see ops/postgres/observability.sql.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "log_min_duration_statement=100", "-c", "track_io_timing=on"]
    environment:
      POSTGRES_USER: radreport
      POSTGRES_PASSWORD: radreport
      POSTGRES_DB: radreport
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radreport"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: radreport
      MINIO_ROOT_PASSWORD: radreport123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # Connection pooler in transaction mode; run the app with RADREPORT_DB__PGBOUNCER=true against port 6432.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASE_URL: postgres://radreport:radreport@db:5432/radreport
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "2000"
      DEFAULT_POOL_SIZE: "20"
      RESERVE_POOL_SIZE: "5"
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    ports:
      - "6432:5432"
    depends_on:
      - db
    profiles: ["pool"]

  # Kafka-compatible broker for RADREPORT_EVENTS__BUS=kafka. Optional: the default bus is Postgres.
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command: ["redpanda", "start", "--overprovisioned", "--smp", "1", "--memory", "512M", "--reserve-memory", "0M", "--node-id", "0", "--check=false", "--kafka-addr", "PLAINTEXT://0.0.0.0:9092", "--advertise-kafka-addr", "PLAINTEXT://localhost:9092"]
    ports:
      - "9092:9092"
    profiles: ["kafka"]

volumes:
  pgdata:
  miniodata:
