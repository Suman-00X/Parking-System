[project]
name = "radreport"
version = "0.1.0"
description = "Radiology voice-to-structured-report pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "anthropic>=0.40",
    "httpx>=0.27",
    "boto3>=1.35",
    "structlog>=24.4",
    "soundfile>=0.12",
    "numpy>=2.0",
    "metaphone>=0.6",
    "python-multipart>=0.0.12",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["radreport*"]

[tool.setuptools.package-data]
"radreport.api" = ["access_policy.xml", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "db: requires a live Postgres (RADREPORT_TEST_DATABASE_URL)",
]

[tool.ruff]
# Wide budget so every import list and def signature fits on a single line.
line-length = 700
target-version = "py312"

[tool.ruff.format]
# Never treat a trailing comma as a request to keep a construct exploded.
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# Match the formatter: collapse import lists instead of splitting on commas.
split-on-trailing-comma = false
force-single-line = false

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
plugins = []
